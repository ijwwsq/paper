# ── basics ───────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB"
set -g mouse on
set -g escape-time 50          # WSL relay can split Alt+key (ESC + key); 10ms was too tight
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on          # copy goes to Windows clipboard (OSC 52)
setw -g mode-keys vi
set -g display-time 1500

# tab name = current folder
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# ── tabs without prefix (Alt) ────────────────────────────
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w confirm-before -p "close tab #W? (y/n)" kill-window
bind -n M-, previous-window
bind -n M-. next-window
bind -n M-< swap-window -t -1 \; previous-window
bind -n M-> swap-window -t +1 \; next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# ── panes ────────────────────────────────────────────────
bind -n 'M-\' split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-z resize-pane -Z
bind -n M-x kill-pane
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "config reloaded"

# copy mode: v select, y copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── look: light, minimal ─────────────────────────────────
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=#8c8c88"
set -g status-left " "
set -g status-left-length 4
# running task timer from `t` (▶ задача 25м), refreshed every status-interval
set -g status-right "#[fg=#5b6fa8]#(~/.local/bin/t status)#[fg=#8c8c88]  #{?client_prefix,#[fg=#5b6fa8]● ,}#S "
set -g status-right-length 60

setw -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#2f2f2f,bold] #I #W "
setw -g window-status-activity-style "fg=#a5803a"
setw -g window-status-bell-style "fg=#b5584e"

set -g pane-border-style "fg=#dcdcd8"
set -g pane-active-border-style "fg=#5b6fa8"
set -g pane-border-lines single
set -g message-style "bg=#ffffff,fg=#2f2f2f"
set -g message-command-style "bg=#ffffff,fg=#2f2f2f"
setw -g mode-style "bg=#e1e7f0,fg=#2f2f2f"
setw -g clock-mode-colour "#5b6fa8"

# ── same Alt shortcuts on the russian layout (Alt+е = Alt+t, etc.) ──
bind -n M-е new-window -c "#{pane_current_path}"
bind -n M-ц confirm-before -p "close tab #W? (y/n)" kill-window
bind -n M-б previous-window
bind -n M-ю next-window
bind -n M-Б swap-window -t -1 \; previous-window
bind -n M-Ю swap-window -t +1 \; next-window
bind -n M-к command-prompt -I "#W" "rename-window '%%'"
bind -n M-р select-pane -L
bind -n M-о select-pane -D
bind -n M-л select-pane -U
bind -n M-д select-pane -R
bind -n M-я resize-pane -Z
bind -n M-ч kill-pane

# popups (summary on terminal open)
set -g popup-style "bg=default"
set -g popup-border-style "fg=#dcdcd8"
set -g popup-border-lines rounded

# F1: cheat sheet popup (layout-independent)
bind -n F1 display-popup -w 100 -h 33 -T " keys " -E "zsh -c '~/.local/bin/keys; read -sk1'"
