# gruvbox dark — tmux colors
set -g status-style "bg=default,fg=#928374"
set -g status-right "#[fg=#fabd2f]#(~/.local/bin/t status)#[fg=#928374]  #{?client_prefix,#[fg=#fabd2f]● ,}#S "
setw -g window-status-current-format "#[fg=#ebdbb2,bold] #I #W "
setw -g window-status-activity-style "fg=#fe8019"
setw -g window-status-bell-style "fg=#fb4934"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"
setw -g mode-style "bg=#504945,fg=#ebdbb2"
setw -g clock-mode-colour "#fabd2f"
set -g popup-border-style "fg=#504945"
