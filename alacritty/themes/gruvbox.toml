# ── colors: gruvbox dark (medium) ────────────────────────
[colors]
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
text = "#282828"
cursor = "#d5c4a1"

[colors.selection]
text = "CellForeground"
background = "#504945"

[colors.search]
matches = { foreground = "#282828", background = "#d79921" }
focused_match = { foreground = "#282828", background = "#fe8019" }

[colors.footer_bar]
foreground = "#282828"
background = "#a89984"

[colors.hints]
start = { foreground = "#282828", background = "#fabd2f" }
end = { foreground = "#fabd2f", background = "#3c3836" }

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
